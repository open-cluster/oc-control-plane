name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod

      - name: Install pinned tooling
        run: make tools

      - name: Validate and bundle the OpenAPI contract
        run: make openapi

      - name: Lint (gofmt + vet + staticcheck + golangci-lint)
        run: make lint

      - name: Build (CGO disabled, trimpath)
        run: make build

      - name: Validate Compose, Helm, and the public container build
        run: make deploy-verify

      - name: Tests (race detector, real Postgres)
        env:
          OC_REQUIRE_CONTAINERS: "1"
        run: make test

      - name: Vulnerability scan (govulncheck)
        run: make vuln

      - name: Dependency license check (go-licenses)
        run: make licenses

      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          set +e
          ./gitleaks git . --config .gitleaks.toml --redact --exit-code 1 \
            --log-opts="--all --full-history" \
            --report-format json --report-path gitleaks-report.json
          scan=$?
          set -e
          if [ "$scan" -ne 0 ] && [ -f gitleaks-report.json ]; then
            echo "::group::gitleaks findings (secret values redacted)"
            jq -r '.[] | "rule=\(.RuleID) file=\(.File) line=\(.StartLine) commit=\(.Commit[0:12]) date=\(.Date) author=\(.Author)"' gitleaks-report.json
            echo "::endgroup::"
          fi
          exit "$scan"

  relay-availability:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.credential.outputs.available }}
    steps:
      - name: Check for the Relay repository credential
        id: credential
        env:
          RELAY_REPO_TOKEN: ${{ secrets.RELAY_REPO_TOKEN }}
        run: |
          if [ -z "$RELAY_REPO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## End-to-end proof: NOT RUN"
              echo
              echo "No \`RELAY_REPO_TOKEN\` secret is configured, so the Relay's repository"
              echo "cannot be checked out and the protocol was not exercised by this run."
              echo "The proof is currently only run on developer machines."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  end-to-end:
    needs: relay-availability
    if: needs.relay-availability.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the Relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-cluster/oc-relay
          token: ${{ secrets.RELAY_REPO_TOKEN }}
          path: .relay

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod

      - name: Prove the protocol carries a job
        env:
          OC_E2E_RELAY_SOURCE: ${{ github.workspace }}/.relay
          OC_REQUIRE_CONTAINERS: "1"
        run: cd test/e2e && go test -timeout 45m -count=1 ./...
