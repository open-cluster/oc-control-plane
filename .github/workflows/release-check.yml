name: release check

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install release tools
        run: make release-tools
      - name: Release verification
        env:
          OC_REQUIRE_CONTAINERS: '1'
        run: make release-check

  relay-availability:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          RELAY_REPO_TOKEN: ${{ secrets.RELAY_REPO_TOKEN }}
        run: |
          if [ -n "$RELAY_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  relay-e2e:
    needs: relay-availability
    runs-on: ubuntu-latest
    if: needs.relay-availability.outputs.available == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-cluster/oc-relay
          token: ${{ secrets.RELAY_REPO_TOKEN }}
          path: .relay
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prove the Relay protocol
        env:
          OC_E2E_RELAY_SOURCE: ${{ github.workspace }}/.relay
          OC_REQUIRE_CONTAINERS: '1'
        run: cd test/e2e && go test -timeout 45m -count=1 ./...

  publish-openapi:
    needs: [verify, relay-availability, relay-e2e]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.verify.result == 'success' && (needs.relay-e2e.result == 'success' || needs.relay-e2e.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bundle OpenAPI
        run: |
          mkdir -p dist
          sh scripts/openapi.sh dist/openapi.yaml
          (cd dist && sha256sum openapi.yaml > openapi.yaml.sha256)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/openapi.yaml dist/openapi.yaml.sha256 --clobber
