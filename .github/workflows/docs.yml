# Documentation CI. docs/ in this repository is the authoring source of truth for the
# user-facing product documentation; the org-level open-cluster/docs repository is the
# publishing home (site chrome and deployment). Validation runs on every change against
# the exact merge the site will serve; the sync job carries content and docs.json into
# the docs repository — publication authorized by the documentation standard (issue #5
# §16) and inert until a DOCS_REPO_TOKEN secret is configured. Actions are pinned by
# commit SHA, as in ci.yml.
name: docs

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', '.github/workflows/docs.yml', '.github/scripts/assemble-docs-site.sh' ]
  pull_request:
    paths: [ 'docs/**', '.github/workflows/docs.yml', '.github/scripts/assemble-docs-site.sh' ]

permissions:
  contents: read

# The Mintlify CLI is pinned for the same reason the Go tools are: a floating validator
# is a gate whose meaning changes without a commit.
env:
  MINT_VERSION: 4.2.810

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The docs site repository is public, so validation needs no credential — only the
      # sync (a write) is gated on one.
      - name: Checkout the docs site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-cluster/docs
          path: .docs-site

      # Validating anything other than the merged tree would validate a site nobody
      # serves; the script is shared with the sync job so the two cannot drift.
      - name: Merge authored content over the site
        run: sh .github/scripts/assemble-docs-site.sh .docs-site

      - name: Validate the Mintlify build
        working-directory: .docs-site
        run: npx --yes mint@${MINT_VERSION} validate

      - name: Check for broken links
        working-directory: .docs-site
        run: npx --yes mint@${MINT_VERSION} broken-links

  # The one publication step this repository carries. It moves only what validate just
  # proved, only from main, and only when the founder has installed a credential for the
  # docs repository — absent that secret the job reports plainly that nothing was
  # published, because a green tick on a sync that never ran is worse than no job.
  sync:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check for the docs repository credential
        id: credential
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          if [ -z "$DOCS_REPO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Documentation sync: NOT RUN"
              echo
              echo "No \`DOCS_REPO_TOKEN\` secret is configured, so the validated content"
              echo "was not published to open-cluster/docs. Configure a token with write"
              echo "access to that repository to enable the sync."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the control plane
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout the docs site for writing
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-cluster/docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: .docs-site

      - name: Publish the authored content
        if: steps.credential.outputs.available == 'true'
        run: |
          sh .github/scripts/assemble-docs-site.sh .docs-site
          cd .docs-site
          if [ -z "$(git status --porcelain)" ]; then
            echo "The site already carries this content; nothing to publish."
            exit 0
          fi
          git config user.name "oc-control-plane docs sync"
          git config user.email "noreply@opencluster.dev"
          git add -A
          git commit -m "docs: sync from oc-control-plane@${GITHUB_SHA}"
          git push
