name: publish OpenAPI contract

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a semantic-version tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Only semantic-version tags publish the OpenAPI contract." >&2
            exit 1
          fi

      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bundle the contract
        run: |
          mkdir -p dist
          sh scripts/openapi.sh dist/openapi.yaml
          (cd dist && sha256sum openapi.yaml > openapi.yaml.sha256)

      - name: Publish the versioned artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          mkdir -p /tmp/openapi-release-assets
          existing="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          for asset in openapi.yaml openapi.yaml.sha256; do
            if grep -Fxq "${asset}" <<<"${existing}"; then
              gh release download "${GITHUB_REF_NAME}" \
                --pattern "${asset}" --dir /tmp/openapi-release-assets
              if ! cmp --silent "dist/${asset}" "/tmp/openapi-release-assets/${asset}"; then
                echo "Release asset ${asset} already exists with different bytes." >&2
                exit 1
              fi
              continue
            fi
            gh release upload "${GITHUB_REF_NAME}" "dist/${asset}"
          done

      - name: Check downstream dispatch configuration
        id: downstream
        env:
          UPDATE_TOKEN: ${{ secrets.OPENAPI_UPDATE_TOKEN }}
          FRONTEND_REPOSITORY: ${{ vars.OPENAPI_FRONTEND_REPOSITORY }}
          DOCS_REPOSITORY: ${{ vars.OPENAPI_DOCS_REPOSITORY }}
        shell: bash
        run: |
          if [[ -n "${UPDATE_TOKEN}" && -n "${FRONTEND_REPOSITORY}" && -n "${DOCS_REPOSITORY}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "configured=false" >> "${GITHUB_OUTPUT}"
          {
            echo "::warning::OpenAPI artifact published, but downstream dispatch was skipped."
            echo "Configure OPENAPI_UPDATE_TOKEN plus OPENAPI_FRONTEND_REPOSITORY and OPENAPI_DOCS_REPOSITORY to open pinned updates."
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Open pinned downstream updates
        if: steps.downstream.outputs.configured == 'true'
        env:
          UPDATE_TOKEN: ${{ secrets.OPENAPI_UPDATE_TOKEN }}
          FRONTEND_REPOSITORY: ${{ vars.OPENAPI_FRONTEND_REPOSITORY }}
          DOCS_REPOSITORY: ${{ vars.OPENAPI_DOCS_REPOSITORY }}
        shell: bash
        run: |
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/openapi.yaml"
          artifact_sha256="$(sha256sum dist/openapi.yaml | cut -d' ' -f1)"
          payload="$(jq -nc \
            --arg commit "${GITHUB_SHA}" \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg url "${artifact_url}" \
            --arg sha256 "${artifact_sha256}" \
            '{event_type:"openapi-contract-released",client_payload:{control_plane_commit:$commit,release_tag:$tag,artifact_url:$url,sha256:$sha256}}')"
          for repository in "${FRONTEND_REPOSITORY}" "${DOCS_REPOSITORY}"; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${UPDATE_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repository}/dispatches" \
              --data "${payload}"
          done
