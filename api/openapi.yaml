      type: object
      additionalProperties: false
      required: [message, queued]
      properties:
        message: { $ref: "#/components/schemas/ConversationMessage" }
        turn: { $ref: "#/components/schemas/ConversationTurn" }
        queued: { type: boolean }
    PostmortemHumanInput:
      type: object
      additionalProperties: false
      properties:
        impact: { type: string, maxLength: 32768 }
        resolution: { type: string, maxLength: 32768 }
        whatWentWell: { type: array, items: { type: string, maxLength: 8192 } }
        whatWentWrong: { type: array, items: { type: string, maxLength: 8192 } }
        detectionGaps: { type: array, items: { type: string, maxLength: 8192 } }
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [at, description, runRefs]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        description: { type: string, minLength: 1, maxLength: 8192 }
        investigationId: { $ref: "#/components/schemas/UUID" }
        runRefs: { type: array, items: { type: integer, minimum: 1 }, uniqueItems: true }
    CitedStatement:
      type: object
      additionalProperties: false
      required: [statement, runRefs]
      properties:
        investigationId: { $ref: "#/components/schemas/UUID" }
        findingId: { type: string, maxLength: 128 }
        statement: { type: string, minLength: 1, maxLength: 8192 }
        runRefs: { type: array, items: { type: integer, minimum: 1 }, uniqueItems: true }
    ActionItem:
      type: object
      additionalProperties: false
      required: [title, owner, deadline, verification, runRefs]
      properties:
        title: { type: string, minLength: 1, maxLength: 1024 }
        owner: { type: string, minLength: 1, maxLength: 256 }
        deadline: { type: string, minLength: 1, maxLength: 128 }
        verification: { type: string, minLength: 1, maxLength: 8192 }
        investigationId: { $ref: "#/components/schemas/UUID" }
        runRefs: { type: array, items: { type: integer, minimum: 1 }, uniqueItems: true }
    Postmortem:
      type: object
      additionalProperties: false
      required: [incidentId, status, revision, title, executiveSummary, impact, detection, timeline, rootCauses, contributingFactors, resolution, whatWentWell, whatWentWrong, detectionGaps, actionItems, openQuestions, createdAt, updatedAt]
      properties:
        incidentId: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [draft, reviewed] }
        revision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 1024 }
        executiveSummary: { type: string, minLength: 1, maxLength: 32768 }
        impact: { type: string, minLength: 1, maxLength: 32768 }
        detection: { type: string, minLength: 1, maxLength: 32768 }
        timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } }
        rootCauses: { type: array, items: { $ref: "#/components/schemas/CitedStatement" } }
        contributingFactors: { type: array, items: { $ref: "#/components/schemas/CitedStatement" } }
        resolution: { type: string, minLength: 1, maxLength: 32768 }
        whatWentWell: { type: array, items: { type: string, maxLength: 8192 } }
        whatWentWrong: { type: array, items: { type: string, maxLength: 8192 } }
        detectionGaps: { type: array, items: { type: string, maxLength: 8192 } }
        actionItems: { type: array, items: { $ref: "#/components/schemas/ActionItem" } }
        openQuestions: { type: array, items: { type: string, maxLength: 8192 } }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        reviewedAt: { $ref: "#/components/schemas/Timestamp" }
        reviewedBy: { type: string, maxLength: 256 }
    PostmortemCorrections:
      allOf:
        - { $ref: "#/components/schemas/PostmortemHumanInput" }
        - type: object
          minProperties: 1
          properties:
            title: { type: string, minLength: 1, maxLength: 1024 }
            executiveSummary: { type: string, minLength: 1, maxLength: 32768 }
            detection: { type: string, minLength: 1, maxLength: 32768 }
            timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } }
            rootCauses: { type: array, items: { $ref: "#/components/schemas/CitedStatement" } }
            contributingFactors: { type: array, items: { $ref: "#/components/schemas/CitedStatement" } }
            actionItems: { type: array, items: { $ref: "#/components/schemas/ActionItem" } }
            openQuestions: { type: array, items: { type: string, maxLength: 8192 } }
    GenericWebhookRequest:
      type: object
      additionalProperties: false
      required: [eventId, status, title, severity, startedAt, deduplicationKey]
      allOf:
        - if:
            properties: { status: { const: resolved } }
          then:
            required: [resolvedAt]
        - if:
            properties: { status: { const: firing } }
          then:
            not: { required: [resolvedAt] }
      properties:
        eventId: { type: string, minLength: 1, maxLength: 256 }
        status: { type: string, enum: [firing, resolved] }
        title:
          type: string
          minLength: 1
          pattern: ".*\\S.*"
          description: Leading and trailing whitespace is removed before enforcing the 512-character limit.
        severity: { type: string, enum: [info, warning, critical] }
        startedAt: { $ref: "#/components/schemas/Timestamp" }
        resolvedAt: { $ref: "#/components/schemas/Timestamp" }
        deduplicationKey: { type: string, minLength: 1, maxLength: 256 }
        labels: { type: object, maxProperties: 32, propertyNames: { minLength: 1, maxLength: 64 }, additionalProperties: { type: string, maxLength: 256 } }
        annotations: { type: object, maxProperties: 32, propertyNames: { minLength: 1, maxLength: 64 }, additionalProperties: { type: string, maxLength: 2048 } }
        sourceUrl: { type: string, format: uri, maxLength: 2048, pattern: "^https?://" }
    AlertmanagerWebhookRequest:
      type: object
      required: [alerts]
      additionalProperties: true
      properties:
        version: { type: string }
        groupKey: { type: string, maxLength: 512 }
        truncatedAlerts: { type: integer, minimum: 0 }
        alerts:
          type: array
          minItems: 1
          maxItems: 2048
          items:
            type: object
            required: [status, fingerprint, startsAt]
            additionalProperties: true
            properties:
              status: { type: string, enum: [firing, resolved] }
              fingerprint: { type: string, minLength: 1, maxLength: 512 }
              startsAt: { $ref: "#/components/schemas/Timestamp" }
              endsAt: { $ref: "#/components/schemas/Timestamp" }
              labels: { type: object, additionalProperties: { type: string } }
              annotations: { type: object, additionalProperties: { type: string } }
              generatorURL: { type: string, maxLength: 2048 }
    WebhookStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, maxLength: 128 }
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, integrationId, providerIdentity, status, attempts, receivedAt, lastAttemptAt, nextEligibleAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        integrationId: { $ref: "#/components/schemas/UUID" }
        providerIdentity: { type: string, minLength: 1, maxLength: 256 }
        lifecyclePhase: { type: string, enum: [firing, resolved] }
        requestId: { type: string, maxLength: 128 }
        status: { type: string, enum: [accepted, processing, succeeded, failed] }
        attempts: { type: integer, minimum: 0, maximum: 12 }
        failureCategory: { type: string, minLength: 1, maxLength: 64 }
        receivedAt: { $ref: "#/components/schemas/Timestamp" }
        lastAttemptAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        nextEligibleAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
    WebhookDeliveryList:
      type: object
      additionalProperties: false
      required: [items, next, total, partial]
      properties:
        <<: *page-metadata
        items: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
    CapabilityMetadata:
      type: object
      additionalProperties: false
      required: [key, enabled, availability]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        enabled: { type: boolean }
        availability: { type: string, enum: [available, unavailable, degraded] }
        reason: { oneOf: [{ type: string, maxLength: 1024 }, { type: "null" }] }
