        - required: [incidentId]
        - required: [question]
    OpenConversationRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        incidentId: { $ref: "#/components/schemas/UUID" }
        subject: { type: string, minLength: 1, maxLength: 512 }
        message: { type: string, minLength: 1, maxLength: 8192 }
    ConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 8192 }
    Conversation:
      type: object
      additionalProperties: false
      required: [id, subject, surface, state, createdAt, lastActivityAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        subject: { type: string, minLength: 1, maxLength: 512 }
        surface: { type: string, enum: [web, slack] }
        state: { type: string, enum: [open, closed] }
        incidentId: { $ref: "#/components/schemas/UUID" }
        createdBy: { type: string, maxLength: 256 }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        lastActivityAt: { $ref: "#/components/schemas/Timestamp" }
    ConversationMessage:
      type: object
      additionalProperties: false
      required: [sequence, role, actorKind, text, createdAt]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [person, agent] }
        actorKind: { type: string, enum: [principal, external] }
        actorId: { type: string, maxLength: 256 }
        actorDisplay: { type: string, maxLength: 256 }
        text: { type: string, minLength: 1, maxLength: 8192 }
        sourceReference: { type: string, maxLength: 1024 }
        investigationId: { $ref: "#/components/schemas/UUID" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    ConversationTurn:
      type: object
      additionalProperties: false
      required: [investigationId, turn, status, createdAt]
      properties:
        investigationId: { $ref: "#/components/schemas/UUID" }
        turn: { type: integer, minimum: 1 }
        status: { type: string, enum: [queued, investigating, needs_input, partial, concluded, cancelled, failed] }
        answer: { type: string, maxLength: 32768 }
        stoppedBy: { type: string, enum: [spend, tool_runs, reasoner_turns, wall_clock, stagnation, context] }
        error: { type: string, maxLength: 4096 }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        concludedAt: { $ref: "#/components/schemas/Timestamp" }
    ConversationList:
      type: object
      additionalProperties: false
      required: [items, next, total, partial]
      properties:
        <<: *page-metadata
        items: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
