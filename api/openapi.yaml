      allOf:
        - { $ref: "#/components/schemas/Conversation" }
        - type: object
          required: [messages, turns]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/ConversationMessage" } }
            turns: { type: array, items: { $ref: "#/components/schemas/ConversationTurn" } }
    ConversationOpened:
      allOf:
        - { $ref: "#/components/schemas/Conversation" }
