replicaCount: 1

image:
  # Set both values to the registry repository and tag of your release.
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

database:
  existingSecret: opencluster-database
  dsnKey: postgres-dsn

credentials:
  existingSecret: opencluster-credentials
  sealingKey: sealing-key
  modelKey: model-key

server:
  # Required: the actual public HTTPS origin served by your deployment.
  publicURL: ""

model:
  provider: anthropic
  name: claude-sonnet-5
  maxOutputTokens:

investigation:
  workers: 8
  maxPendingPerOrganization: 100


service:
  type: ClusterIP
  httpPort: 8081

relay:
  enabled: false
  internalPort: 8444
  externalPort: 8443
  spkiPins: []
  tls:
    existingSecret: ""
    certificateKey: tls.crt
    privateKey: tls.key
    image: nginx:1.27-alpine

resources: {}

logLevel: info

github:
  appID: ""
  clientID: ""
  # Keys in credentials.existingSecret when appID is supplied.
  privateKeyKey: github-app-private-key
  clientSecretKey: github-client-secret
