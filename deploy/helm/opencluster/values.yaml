replicaCount: 1

image:
  repository: opencluster-control-plane
  tag: dev
  pullPolicy: Never

database:
  existingSecret: opencluster-database
  dsnKey: postgres-dsn

credentials:
  existingSecret: opencluster-credentials
  bootstrapTokenKey: bootstrap-token
  sealingKey: sealing-key
  modelKey: model-key

server:
  publicURL: "http://localhost:8081"

model:
  provider: anthropic
  name: claude-sonnet-5
  contextWindowTokens:
  maxOutputTokens:

investigation:
  workers: 8
  maxPendingPerOrganization: 100

sessionLifetimeSeconds: 43200

service:
  type: ClusterIP
  httpPort: 8081

relay:
  enabled: false
  internalPort: 8444
  externalPort: 8443
  spkiPins: []
  tls:
    existingSecret: ""
    certificateKey: tls.crt
    privateKey: tls.key
    image: nginx:1.27-alpine

resources: {}

logLevel: info
