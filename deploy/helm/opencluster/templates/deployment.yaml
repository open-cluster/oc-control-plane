apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-opencluster
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: opencluster
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencluster
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/opencluster/opencluster.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            {{- if .Values.relay.enabled }}
            - name: relay-internal
              containerPort: {{ .Values.relay.internalPort }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: configuration
              mountPath: /etc/opencluster
              readOnly: true
            - name: database
              mountPath: /run/opencluster/secrets
              readOnly: true
            - name: credentials
              mountPath: /run/opencluster/credentials
              readOnly: true
        {{- if .Values.relay.enabled }}
        - name: relay-tls
          image: {{ .Values.relay.tls.image | quote }}
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          ports:
            - name: relay-tls
              containerPort: {{ .Values.relay.externalPort }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: configuration
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: relay-certificates
              mountPath: /run/opencluster/relay-tls
              readOnly: true
            - name: relay-temporary
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: configuration
          configMap:
            name: {{ .Release.Name }}-opencluster
        - name: database
          secret:
            secretName: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
            defaultMode: 0440
        - name: credentials
          secret:
            secretName: {{ required "credentials.existingSecret is required" .Values.credentials.existingSecret }}
            defaultMode: 0440
        {{- if .Values.relay.enabled }}
        - name: relay-certificates
          secret:
            secretName: {{ required "relay.tls.existingSecret is required when relay.enabled is true" .Values.relay.tls.existingSecret }}
            defaultMode: 0440
        - name: relay-temporary
          emptyDir:
            medium: Memory
        {{- end }}
