apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-opencluster
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: opencluster
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: opencluster
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: OC_SERVER_ADDRESS
              value: ":{{ .Values.service.httpPort }}"
            - name: OC_PUBLIC_URL
              value: {{ .Values.operator.publicURL | quote }}
            - name: OC_DATABASE_DSN_FILE
              value: "/run/opencluster/secrets/{{ .Values.database.dsnKey }}"
            {{- with .Values.credentials.operatorTokenKey }}
            - name: OC_BOOTSTRAP_TOKEN_FILE
              value: "/run/opencluster/credentials/{{ . }}"
            {{- end }}
            - name: OC_ENCRYPTION_KEY_FILE
              value: "/run/opencluster/credentials/{{ .Values.credentials.sealingKey }}"
            - name: OC_AI_API_KEY_FILE
              value: "/run/opencluster/credentials/{{ .Values.credentials.modelKey }}"
            - name: OC_AI_PROVIDER
              value: {{ .Values.model.provider | quote }}
            - name: OC_AI_MODEL
              value: {{ .Values.model.name | quote }}
            {{- with .Values.model.contextWindowTokens }}
            - name: OC_AI_CONTEXT_WINDOW_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.model.maxOutputTokens }}
            - name: OC_AI_MAX_OUTPUT_SIZE
              value: {{ . | quote }}
            {{- end }}
            - name: OC_INVESTIGATION_WORKERS
              value: {{ .Values.investigation.workers | quote }}
            - name: OC_MAX_PENDING_INVESTIGATIONS_PER_ORGANIZATION
              value: {{ .Values.investigation.maxPendingPerOrganization | quote }}
            - name: OC_SESSION_LIFETIME_SECONDS
              value: {{ .Values.sessionLifetimeSeconds | quote }}
            - name: OC_LOG_LEVEL
              value: {{ .Values.logLevel | default "info" | quote }}
            {{- if .Values.relay.enabled }}
            - name: OC_RELAY_ADDRESS
              value: ":{{ .Values.relay.internalPort }}"
            - name: OC_RELAY_SPKI_PINS
              value: {{ required "relay.spkiPins requires the TLS certificate's public-key digest" .Values.relay.spkiPins | join "," | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            {{- if .Values.relay.enabled }}
            - name: relay-internal
              containerPort: {{ .Values.relay.internalPort }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: database
              mountPath: /run/opencluster/secrets
              readOnly: true
            - name: credentials
              mountPath: /run/opencluster/credentials
              readOnly: true
        {{- if .Values.relay.enabled }}
        - name: relay-tls
          image: {{ .Values.relay.tls.image | quote }}
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          ports:
            - name: relay-tls
              containerPort: {{ .Values.relay.externalPort }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: configuration
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: relay-certificates
              mountPath: /run/opencluster/relay-tls
              readOnly: true
            - name: relay-temporary
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: configuration
          configMap:
            name: {{ .Release.Name }}-opencluster
        - name: database
          secret:
            secretName: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
            defaultMode: 0440
        - name: credentials
          secret:
            secretName: {{ required "credentials.existingSecret is required" .Values.credentials.existingSecret }}
            defaultMode: 0440
        {{- if .Values.relay.enabled }}
        - name: relay-certificates
          secret:
            secretName: {{ required "relay.tls.existingSecret is required when relay.enabled is true" .Values.relay.tls.existingSecret }}
            defaultMode: 0440
        - name: relay-temporary
          emptyDir:
            medium: Memory
        {{- end }}
