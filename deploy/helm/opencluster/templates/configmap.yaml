apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-opencluster
data:
  opencluster.yaml: |
    server:
      address: ":{{ .Values.service.httpPort }}"
      public_url: {{ .Values.operator.publicURL | quote }}
    database:
      dsn_file: "/run/opencluster/secrets/{{ .Values.database.dsnKey }}"
    authentication:
      bootstrap_token_file: "/run/opencluster/credentials/{{ .Values.credentials.operatorTokenKey }}"
      encryption_key_file: "/run/opencluster/credentials/{{ .Values.credentials.sealingKey }}"
    ai:
      provider: {{ .Values.model.provider | quote }}
      model: {{ .Values.model.name | quote }}
      api_key_file: "/run/opencluster/credentials/{{ .Values.credentials.modelKey }}"
      context_window_tokens: {{ .Values.model.contextWindowTokens }}
    investigation:
      workers: {{ .Values.investigation.workers }}
      max_pending_per_organization: {{ .Values.investigation.maxPendingPerOrganization }}
    {{- if .Values.relay.enabled }}
    relay:
      address: ":{{ .Values.relay.internalPort }}"
      spki_pins: {{ required "relay.spkiPins requires the TLS certificate's public-key digest" .Values.relay.spkiPins | toJson }}
    {{- end }}
  {{- if .Values.relay.enabled }}
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client-body;
      proxy_temp_path /tmp/proxy;
      server {
        listen {{ .Values.relay.externalPort }} ssl;
        http2 on;
        ssl_certificate /run/opencluster/relay-tls/{{ .Values.relay.tls.certificateKey }};
        ssl_certificate_key /run/opencluster/relay-tls/{{ .Values.relay.tls.privateKey }};
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
          grpc_pass grpc://127.0.0.1:{{ .Values.relay.internalPort }};
          grpc_read_timeout 1h;
          grpc_send_timeout 1h;
        }
      }
    }
  {{- end }}
