<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">OpenCluster system architecture</title>
<desc id="desc">Web console, alerts, and Slack enter the OpenCluster Go control plane. Coordination, investigation workers, and integration tools use PostgreSQL, external AI providers, provider APIs, and the customer-side Relay, which opens outbound gRPC sessions for bounded Kubernetes reads.</desc>
