components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-oc_session
    BootstrapToken:
      type: http
      scheme: bearer
      description: Deployment bootstrap credential; accepted only until bootstrap succeeds.
    WebhookToken:
      type: apiKey
      in: header
      name: X-OpenCluster-Token
      description: Static sender credential. It authenticates the sender and does not sign the body.
    SlackSignature:
      type: apiKey
      in: header
      name: X-Slack-Signature
      description: Slack request signature verified with the configured signing secret.
  parameters:
    Organization:
      name: X-OpenCluster-Organization
      in: header
      required: true
      description: Selects the Organization whose data and membership are authorized.
      schema:
        $ref: '#/components/schemas/OrganizationID'
      example: acme-production
    OptionalOrganization:
      name: X-OpenCluster-Organization
      in: header
      required: false
      description: Optionally selects an Organization for Organization-specific session facts.
      schema:
        $ref: '#/components/schemas/OrganizationID'
      example: acme-production
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque resume position returned in the preceding page's next field.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IntegrationSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive containment search over the Integration name.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    RelaySearch:
      name: search
      in: query
      required: false
      description: Case-insensitive containment search over the Relay identifier, fingerprint, and version.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IncidentSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive containment search over the Incident title and source grouping key.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ConversationSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive containment search over the Conversation subject.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IntegrationSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - -createdAt
    RelaySort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - registeredAt
          - -registeredAt
          - lastSeenAt
          - -lastSeenAt
          - version
          - -version
          - fingerprint
          - -fingerprint
    IncidentSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - lastSeenAt
          - -lastSeenAt
          - firstSeenAt
          - -firstSeenAt
          - title
          - -title
          - alertEventCount
          - -alertEventCount
    ConversationSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - lastActivityAt
          - -lastActivityAt
    IntegrationTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
          - alertmanager
          - generic_webhook
          - github
          - kubernetes
          - slack
    RelayFilter:
      name: relay
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
    DisabledFilter:
      name: disabled
      in: query
      required: false
      schema:
        type: boolean
    RelayStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - connected
          - disconnected
          - revoked
          - degraded
    RelayVersionFilter:
      name: version
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RelayCapabilityFilter:
      name: capability
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IncidentIntegrationFilter:
      name: integrationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
    IncidentStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - open
          - resolved
    InvestigationIncidentFilter:
      name: incidentId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
    ConversationIncidentFilter:
      name: incidentId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
    ConversationStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - open
          - closed
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    OAuthCode:
      name: code
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    OAuthState:
      name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 4096
    UserID:
      name: user
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    MembershipID:
      name: membership
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    SessionID:
      name: session
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IntegrationID:
      name: integration
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IntegrationType:
      name: type
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]{0,63}$
    RelayRegistrationID:
      name: registration
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IncidentID:
      name: incident
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    InvestigationID:
      name: investigation
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ConversationID:
      name: conversation
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    WebhookDeliveryID:
      name: delivery
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    WebhookDeliveryStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - accepted
          - processing
          - succeeded
          - failed
  responses:
    ErrorResponse:
      description: The operation did not complete.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: The operation completed and has no response body.
    BootstrapCreated:
      description: Initial local User and membership-free session created atomically.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BootstrapResult'
    SignIn:
      description: Sign-in succeeded and the session cookie was issued.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignInResult'
    SignOut:
      description: The browser cookie was cleared; signedOut states whether a server-side session was ended.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignOut'
    Session:
      description: Current session facts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    PermissionList:
      description: Effective permissions in the selected Organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PermissionList'
    MemberList:
      description: Organization members.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemberList'
    Member:
      description: Organization member.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Member'
    SessionList:
      description: Live Organization sessions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LiveSessionList'
    Policy:
      description: Organization identity policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Policy'
    AuditEventList:
      description: Organization audit events.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditEventList'
    IntegrationTypeList:
      description: Integration Types served by this build.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationTypeList'
    ConnectStarted:
      description: Provider-owned installation flow started.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectStarted'
    ConnectLanded:
      description: Provider-owned installation flow outcome.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectLanded'
    IntegrationList:
      description: Configured Integrations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationList'
    IntegrationCreated:
      description: Integration created; webhookSecret is present only in this response when applicable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedIntegration'
    Integration:
      description: Configured Integration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Integration'
    SecretRotated:
      description: New webhook secret returned once; only its digest is retained.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RotatedSecret'
    RelayList:
      description: Relay roster.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RelayList'
    RelayFleetSummary:
      description: Relay fleet assessment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RelayFleetSummary'
    RelayBootstrapToken:
      description: Bootstrap token returned once; only its digest is retained.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RelayBootstrapToken'
    RelayIntegrationList:
      description: Integrations served by a Relay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RelayIntegrationList'
    RelayFailureList:
      description: Recent failed or cancelled Relay work.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RelayFailureList'
    RelayConflictTrail:
      description: Durable Relay session-conflict trail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RelayConflictTrail'
    IncidentList:
      description: Incidents.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IncidentList'
    Incident:
      description: Incident.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Incident'
    AlertEventList:
      description: Alert Events in an Incident.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertEventList'
    Clarification:
      description: A question needed before an Investigation can be opened.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Clarification'
    InvestigationList:
      description: Investigations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvestigationList'
    Investigation:
      description: Investigation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Investigation'
    InvestigationDetail:
      description: Investigation with sources and Tool Runs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvestigationDetail'
    InvestigationActivity:
      description: Investigation activity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvestigationActivity'
    InvestigationSources:
      description: Investigation sources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvestigationSources'
    InvestigationHypotheses:
      description: Investigation hypotheses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvestigationHypotheses'
    ConversationList:
      description: Conversations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConversationList'
    ConversationOpened:
      description: Conversation opened, with an optional first Message and turn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConversationOpened'
    ConversationDetail:
      description: Conversation with Messages and turns.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConversationDetail'
    ConversationMessageAccepted:
      description: Message accepted; turn is absent when queued behind an active turn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageAccepted'
    Postmortem:
      description: Postmortem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Postmortem'
    WebhookDeliveryList:
      description: Accepted webhook deliveries.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookDeliveryList'
    WebhookDelivery:
      description: One accepted webhook delivery.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookDelivery'
    WebhookAccepted:
      description: Delivery durably accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    WebhookDuplicate:
      description: Delivery was already accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    WebhookRejected:
      description: Permanent malformed delivery.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    WebhookUnauthorized:
      description: Missing or invalid webhook credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    WebhookOversized:
      description: Body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    WebhookUnavailable:
      description: Delivery could not be durably recorded; retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    Redirect:
      description: Browser redirect.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or rejected credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Membership, permission, Organization selection, or cookie origin was rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found in the selected Organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The requested state conflicts with durable state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: A bounded concurrency or request limit was reached.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: A required configured capability is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    OrganizationID:
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      minLength: 1
      maxLength: 63
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          minLength: 1
          maxLength: 1024
          example: the selected Organization is not available to this caller
        reason:
          type: string
          enum:
            - credential_rejected
            - session_expired
            - session_revoked
        requires:
          type: string
          minLength: 1
          maxLength: 128
    LocalBootstrapRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: operator@example.invalid
        displayName:
          type: string
          minLength: 1
          maxLength: 256
          example: On-call Operator
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true
          example: correct-horse-placeholder
    LocalSignInRequest:
      type: object
      additionalProperties: false
      required:
        - organization
        - email
        - password
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationID'
        email:
          type: string
          format: email
          maxLength: 254
          example: operator@example.invalid
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true
          example: correct-horse-placeholder
    Principal:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - displayName
        - roles
        - scopes
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        kind:
          type: string
          enum:
            - user
            - automation
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        email:
          type: string
          format: email
          maxLength: 254
        roles:
          type: array
          items:
            type: string
            enum:
              - admin
              - editor
              - viewer
          uniqueItems: true
        scopes:
          type: array
          items:
            type: string
          uniqueItems: true
    Organization:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - membership
      properties:
        id:
          $ref: '#/components/schemas/OrganizationID'
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        membership:
          $ref: '#/components/schemas/OrganizationMembership'
    OrganizationMembership:
      type: object
      additionalProperties: false
      required:
        - id
        - role
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
    Membership:
      type: object
      additionalProperties: false
      required:
        - id
        - organizationId
        - displayName
        - role
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
    OrganizationList:
      type: object
      additionalProperties: false
      required:
        - organizations
        - next
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        next:
          oneOf:
            - type: string
              maxLength: 512
            - type: 'null'
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        requestedSlug:
          $ref: '#/components/schemas/OrganizationID'
    Session:
      type: object
      additionalProperties: false
      required:
        - principal
        - organizations
        - authenticationMethod
        - csrf
        - expiresAt
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        activeOrganization:
          oneOf:
            - $ref: '#/components/schemas/Membership'
            - type: 'null'
        authenticationMethod:
          type: string
          enum:
            - local
            - oidc
            - automation
        csrf:
          type: object
          additionalProperties: false
          required:
            - mode
            - requiredForUnsafeMethods
          properties:
            mode:
              type: string
              const: origin
            requiredForUnsafeMethods:
              type: boolean
              const: true
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    SignOut:
      type: object
      additionalProperties: false
      required:
        - signedOut
      properties:
        signedOut:
          type: boolean
    BootstrapResult:
      type: object
      additionalProperties: false
      required:
        - bootstrapped
      properties:
        bootstrapped:
          type: boolean
          const: true
    SignInResult:
      type: object
      additionalProperties: false
      required:
        - signedIn
      properties:
        signedIn:
          type: boolean
          const: true
    PermissionList:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - role
        - permissions
        - next
      properties:
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
        permissions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          uniqueItems: true
        next:
          oneOf:
            - type: string
              maxLength: 512
            - type: 'null'
    Member:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - email
        - displayName
        - role
        - source
        - active
        - disabled
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        userId:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
        source:
          type: string
          enum:
            - manual
            - jit
            - scim
        active:
          type: boolean
        disabled:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    MemberList:
      type: object
      additionalProperties: false
      required:
        - members
        - next
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next:
          type: string
          maxLength: 512
    LiveSession:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - issuedAt
        - expiresAt
        - lastSeenAt
        - userAgent
        - address
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        userId:
          $ref: '#/components/schemas/UUID'
        issuedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
        userAgent:
          type: string
          maxLength: 512
        address:
          type: string
          maxLength: 128
    LiveSessionList:
      type: object
      additionalProperties: false
      required:
        - sessions
        - next
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/LiveSession'
        next:
          oneOf:
            - type: string
              maxLength: 512
            - type: 'null'
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - actorKind
        - actorId
        - actorName
        - action
        - targetKind
        - targetId
        - outcome
        - sourceAddress
        - requestId
        - detail
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        actorKind:
          type: string
          enum:
            - user
            - automation
            - system
        actorId:
          type: string
          maxLength: 256
        actorName:
          type: string
          maxLength: 256
        action:
          type: string
          minLength: 1
          maxLength: 128
        targetKind:
          type: string
          minLength: 1
          maxLength: 128
        targetId:
          type: string
          maxLength: 256
        outcome:
          type: string
          enum:
            - allowed
            - denied
            - failed
        sourceAddress:
          type: string
          maxLength: 128
        requestId:
          type: string
          maxLength: 128
        detail:
          type: object
          additionalProperties: true
    AuditEventList:
      type: object
      additionalProperties: false
      required:
        - events
