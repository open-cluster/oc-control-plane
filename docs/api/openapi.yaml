openapi: 3.1.0
info:
  title: OpenCluster Control Plane API
  version: 0.1.0
  description: HTTP contract for the OpenCluster product API and inbound webhook endpoints.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local self-hosted deployment
tags:
  - name: Authentication
  - name: Organizations
  - name: Members
  - name: Sessions
  - name: Policy
  - name: Audit
  - name: Integration Types
  - name: Integrations
  - name: Relays
  - name: Incidents
  - name: Investigations
  - name: Conversations
  - name: Postmortems
  - name: Webhook Deliveries
  - name: Webhook Intake
  - name: Metadata
paths:
  /api/v1/meta:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-organization-selector: forbidden
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      responses:
        '200':
          description: Edition-neutral capabilities supported by this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityMetadataList'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: getCapabilityMetadata
      summary: Get capability metadata
      tags:
        - Metadata
  /api/v1/auth/local/bootstrap:
    post:
      security:
        - BootstrapToken: []
      x-opencluster-access: public
      x-opencluster-organization-selector: forbidden
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-supported
      responses:
        '201':
          $ref: '#/components/responses/BootstrapCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: bootstrapLocalAdmin
      summary: Bootstrap local admin
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalBootstrapRequest'
        required: true
  /api/v1/auth/local/sign-in:
    post:
      security: []
      x-opencluster-access: public
      x-opencluster-organization-selector: forbidden
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-supported
      responses:
        '200':
          $ref: '#/components/responses/SignIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: signInLocal
      summary: Sign in with local authentication
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalSignInRequest'
        required: true
  /api/v1/auth/oidc/start:
    get:
      security: []
      x-opencluster-access: public
      x-opencluster-organization-selector: forbidden
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: startOIDCSignIn
      summary: Start OIDC sign in
      tags:
        - Authentication
      parameters:
        - name: organization
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/OrganizationID'
  /api/v1/auth/oidc/callback:
    get:
      security: []
      x-opencluster-access: public
      x-opencluster-organization-selector: forbidden
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: completeOIDCSignIn
      summary: Complete OIDC sign in
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
  /api/v1/session:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-organization-selector: optional
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/OptionalOrganization'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: getSession
      summary: Get session
      tags:
        - Sessions
    delete:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-organization-selector: forbidden
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      responses:
        '200':
          $ref: '#/components/responses/SignOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: signOut
      summary: Sign out
      tags:
        - Sessions
  /api/v1/organizations:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-organization-selector: forbidden
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      responses:
        '200':
          description: Organizations available to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: listOrganizations
      summary: List organizations
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
    post:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-organization-selector: forbidden
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      responses:
        '201':
          description: Organization and initial Admin membership created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: createOrganization
      summary: Create organization
      tags:
        - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
        required: true
  /api/v1/permissions:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/PermissionList'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: listEffectivePermissions
      summary: List effective permissions
      tags:
        - Organizations
  /api/v1/members:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/MemberList'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: listMembers
      summary: List members
      tags:
        - Members
  /api/v1/local-users:
    post:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '201':
          $ref: '#/components/responses/Member'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: createLocalUser
      summary: Create local user
      tags:
        - Members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocalUserRequest'
        required: true
  /api/v1/members/{membership}:
    parameters:
      - $ref: '#/components/parameters/MembershipID'
    patch:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          $ref: '#/components/responses/Member'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: updateMember
      summary: Update member
      tags:
        - Members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
        required: true
    delete:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '204':
          description: Membership removed and its sessions revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: removeMember
      summary: Remove member
      tags:
        - Members
  /api/v1/local-users/{user}/password:
    parameters:
      - $ref: '#/components/parameters/UserID'
    put:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: replaceMemberPassword
      summary: Replace member password
      tags:
        - Members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
        required: true
  /api/v1/sessions:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/SessionList'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: listSessions
      summary: List sessions
      tags:
        - Sessions
  /api/v1/sessions/{session}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    delete:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '204':
          description: The named session was revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: revokeSession
      summary: Revoke session
      tags:
        - Sessions
  /api/v1/policy:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          $ref: '#/components/responses/Policy'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: getOrganizationPolicy
      summary: Get organization policy
      tags:
        - Policy
    put:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          $ref: '#/components/responses/Policy'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: replaceOrganizationPolicy
      summary: Replace organization policy
      tags:
        - Policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
        required: true
  /api/v1/audit-events:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/AuditEventList'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: listAuditEvents
      summary: List audit events
      tags:
        - Audit
  /api/v1/integration-types:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/IntegrationTypeList'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: listIntegrationTypes
      summary: List integration types
      tags:
        - Integration Types
  /api/v1/integration-types/{type}/connect:
    parameters:
      - $ref: '#/components/parameters/IntegrationType'
    post:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          $ref: '#/components/responses/ConnectStarted'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: startIntegrationConnect
      summary: Start provider authorization
      tags:
        - Integration Types
  /api/v1/integrations/connect/callback:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-organization-selector: forbidden
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      responses:
        '200':
          $ref: '#/components/responses/ConnectLanded'
        '302':
          $ref: '#/components/responses/Redirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: completeIntegrationConnect
      summary: Complete provider authorization
      tags:
        - Integrations
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
  /api/v1/integrations:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IntegrationSearch'
        - $ref: '#/components/parameters/IntegrationSort'
        - $ref: '#/components/parameters/IntegrationTypeFilter'
        - $ref: '#/components/parameters/RelayFilter'
        - $ref: '#/components/parameters/DisabledFilter'
      responses:
        '200':
          $ref: '#/components/responses/IntegrationList'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: listIntegrations
      summary: List integrations
      tags:
        - Integrations
    post:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '201':
          $ref: '#/components/responses/IntegrationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: createIntegration
      summary: Create integration
      tags:
        - Integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
        required: true
  /api/v1/integrations/{integration}:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          $ref: '#/components/responses/Integration'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: getIntegration
      summary: Get integration
      tags:
        - Integrations
    patch:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          $ref: '#/components/responses/Integration'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: updateIntegration
      summary: Update integration
      tags:
        - Integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationRequest'
        required: true
    delete:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '204':
          description: Integration deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteIntegration
      summary: Delete integration
      tags:
        - Integrations
  /api/v1/integrations/{integration}/enable:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
    post:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: intrinsic
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: enableIntegration
      summary: Enable integration
      tags:
        - Integrations
  /api/v1/integrations/{integration}/disable:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
    post:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: intrinsic
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: disableIntegration
      summary: Disable integration
      tags:
        - Integrations
  /api/v1/integrations/{integration}/verify:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
    post:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          $ref: '#/components/responses/Integration'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: verifyIntegration
      summary: Verify integration
      tags:
        - Integrations
  /api/v1/integrations/{integration}/rotate-webhook-secret:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
    post:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          $ref: '#/components/responses/SecretRotated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: rotateIntegrationWebhookSecret
      summary: Rotate integration webhook secret
      tags:
        - Integrations
  /api/v1/relays:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RelaySearch'
        - $ref: '#/components/parameters/RelaySort'
        - $ref: '#/components/parameters/RelayStateFilter'
        - $ref: '#/components/parameters/RelayVersionFilter'
        - $ref: '#/components/parameters/RelayCapabilityFilter'
      responses:
        '200':
          $ref: '#/components/responses/RelayList'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: listRelays
      summary: List relays
      tags:
        - Relays
  /api/v1/relays/summary:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
      x-opencluster-organization-selector: required
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      parameters:
        - $ref: '#/components/parameters/Organization'
      responses:
        '200':
          $ref: '#/components/responses/RelayFleetSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
      operationId: getRelayFleetSummary
      summary: Get relay fleet summary
      tags:
        - Relays
  /api/v1/relays/bootstrap-tokens:
    post:
      security:
        - SessionCookie: []
      x-opencluster-access: privileged
