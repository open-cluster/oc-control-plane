        actorName:
          type: string
          maxLength: 512
        action:
          type: string
          minLength: 1
          maxLength: 128
        targetKind:
          type: string
          minLength: 1
          maxLength: 128
        targetId:
          type: string
          maxLength: 512
        outcome:
          type: string
          enum:
            - allowed
            - denied
            - failed
        sourceAddress:
          type: string
          maxLength: 128
        requestId:
          type: string
          maxLength: 128
        detail:
