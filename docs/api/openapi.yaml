            $ref: '#/components/schemas/WebhookStatus'
    WebhookUnauthorized:
      description: Missing or invalid webhook credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    WebhookOversized:
      description: Body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    AlertWebhookUnavailable:
      description: Admission capacity or pending Investigation capacity is temporarily exhausted, or the delivery could not be durably recorded. No delivery changes are recorded; retry and honor Retry-After when present.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    WebhookUnavailable:
      description: Delivery could not be durably recorded; retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookStatus'
    Redirect:
      description: Browser redirect.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or rejected credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Membership, permission, or cookie origin was rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found in the authenticated User's Organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The requested state conflicts with durable state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: A bounded concurrency or request limit was reached.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: A required configured capability is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UUID:
