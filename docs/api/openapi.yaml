        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignOut'
    Session:
      description: Current session facts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    MemberList:
