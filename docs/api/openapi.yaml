          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        rootCauses:
          type: array
          items:
            $ref: '#/components/schemas/CitedStatement'
        contributingFactors:
          type: array
          items:
            $ref: '#/components/schemas/CitedStatement'
        resolution:
          type: string
          minLength: 1
          maxLength: 32768
        whatWentWell:
          type: array
          items:
            type: string
            maxLength: 8192
        whatWentWrong:
          type: array
          items:
            type: string
            maxLength: 8192
        detectionGaps:
          type: array
          items:
            type: string
            maxLength: 8192
        actionItems:
          type: array
          items:
            $ref: '#/components/schemas/ActionItem'
        openQuestions:
          type: array
          items:
            type: string
            maxLength: 8192
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        reviewedAt:
          $ref: '#/components/schemas/Timestamp'
        reviewedBy:
          type: string
          maxLength: 256
    PostmortemCorrections:
      allOf:
        - $ref: '#/components/schemas/PostmortemHumanInput'
        - type: object
          minProperties: 1
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 1024
            executiveSummary:
              type: string
              minLength: 1
              maxLength: 32768
            detection:
              type: string
              minLength: 1
              maxLength: 32768
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/TimelineEntry'
            rootCauses:
              type: array
              items:
                $ref: '#/components/schemas/CitedStatement'
            contributingFactors:
              type: array
              items:
                $ref: '#/components/schemas/CitedStatement'
            actionItems:
              type: array
              items:
                $ref: '#/components/schemas/ActionItem'
            openQuestions:
              type: array
              items:
                type: string
                maxLength: 8192
    GenericWebhookRequest:
      type: object
      additionalProperties: false
      required:
        - eventId
        - status
        - title
        - severity
        - startedAt
        - deduplicationKey
      allOf:
        - if:
            properties:
              status:
                const: resolved
          then:
            required:
              - resolvedAt
            properties:
              resolvedAt: {}
        - if:
            properties:
              status:
                const: firing
          then:
            not:
              required:
                - resolvedAt
              properties:
                resolvedAt: {}
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: string
          enum:
            - firing
            - resolved
        title:
          type: string
          minLength: 1
          pattern: .*\S.*
          description: Leading and trailing whitespace is removed before enforcing the 512-character limit.
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        resolvedAt:
          $ref: '#/components/schemas/Timestamp'
        deduplicationKey:
          type: string
          minLength: 1
          maxLength: 256
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 256
        annotations:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 2048
        sourceUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
    AlertmanagerWebhookRequest:
      type: object
      required:
        - alerts
      additionalProperties: true
      properties:
        version:
          type: string
        groupKey:
          type: string
          maxLength: 512
        truncatedAlerts:
          type: integer
          minimum: 0
        alerts:
          type: array
          minItems: 1
          maxItems: 2048
          items:
            type: object
            required:
              - status
              - fingerprint
              - startsAt
            additionalProperties: true
            properties:
              status:
                type: string
                enum:
                  - firing
                  - resolved
              fingerprint:
                type: string
                minLength: 1
                maxLength: 512
              startsAt:
                $ref: '#/components/schemas/Timestamp'
              endsAt:
                $ref: '#/components/schemas/Timestamp'
              labels:
                type: object
                additionalProperties:
                  type: string
              annotations:
                type: object
                additionalProperties:
                  type: string
              generatorURL:
                type: string
                maxLength: 2048
    WebhookStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          maxLength: 128
