components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-oc_session
    BootstrapToken:
      type: http
      scheme: bearer
      description: Deployment bootstrap credential; accepted only until bootstrap succeeds.
    WebhookToken:
      type: apiKey
      in: header
      name: X-OpenCluster-Token
      description: Static sender credential. It authenticates the sender and does not sign the body.
    SlackSignature:
      type: apiKey
      in: header
      name: X-Slack-Signature
      description: Slack request signature verified with the configured signing secret.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque resume position returned in the preceding page's next field.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IntegrationSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive containment search over the Integration name.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    RelaySearch:
      name: search
      in: query
      required: false
      description: Case-insensitive containment search over the Relay identifier, fingerprint, and version.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IncidentSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive containment search over the Incident title and source grouping key.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ConversationSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive containment search over the Conversation subject.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IntegrationSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - -createdAt
    RelaySort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - registeredAt
          - -registeredAt
          - lastSeenAt
          - -lastSeenAt
          - version
          - -version
          - fingerprint
          - -fingerprint
    IncidentSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - lastSeenAt
          - -lastSeenAt
          - firstSeenAt
          - -firstSeenAt
          - title
          - -title
          - alertEventCount
          - -alertEventCount
    ConversationSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - lastActivityAt
          - -lastActivityAt
    IntegrationTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
          - alertmanager
          - generic_webhook
          - github
          - kubernetes
          - slack
    RelayFilter:
      name: relay
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
    DisabledFilter:
      name: disabled
      in: query
      required: false
      schema:
        type: boolean
    RelayStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - connected
          - disconnected
          - revoked
          - degraded
    RelayVersionFilter:
      name: version
      in: query
      required: false
      description: Exact Relay version without surrounding whitespace.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^\S(?:.*\S)?$
    RelayCapabilityFilter:
      name: capability
      in: query
      required: false
      description: Exact capability identifier without surrounding whitespace.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^\S(?:.*\S)?$
    IncidentIntegrationFilter:
      name: integrationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
    IncidentStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - open
          - resolved
    InvestigationIncidentFilter:
      name: incidentId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
    ConversationIncidentFilter:
      name: incidentId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
    ConversationStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - open
          - closed
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    OAuthCode:
      name: code
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    OAuthState:
      name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 4096
    UserID:
      name: user
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IntegrationID:
      name: integration
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IntegrationType:
      name: type
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]{0,63}$
    RelayRegistrationID:
      name: registration
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IncidentID:
      name: incident
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    InvestigationID:
      name: investigation
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ConversationID:
      name: conversation
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    MessageSequence:
      name: sequence
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    ErrorResponse:
      description: The operation did not complete.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: The operation completed and has no response body.
    BootstrapCreated:
      description: Initial Organization, Admin User, password, Membership, and session created atomically.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BootstrapResult'
    SignIn:
