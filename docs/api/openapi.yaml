openapi: 3.1.0
info:
  title: OpenCluster Control Plane API
  version: 0.1.0
  description: HTTP contract for the OpenCluster product API and inbound webhook endpoints.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local self-hosted deployment
tags:
  - name: Authentication
  - name: Organizations
  - name: Members
  - name: Sessions
  - name: Policy
  - name: Audit
  - name: Integration Types
  - name: Integrations
  - name: Relays
  - name: Incidents
  - name: Investigations
  - name: Conversations
  - name: Postmortems
  - name: Slack
  - name: Webhook Intake
paths:
  /api/v1/auth/local/bootstrap:
    post:
      security:
        - BootstrapToken: []
      x-opencluster-access: public
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-supported
      responses:
        '201':
          $ref: '#/components/responses/BootstrapCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: bootstrapLocalAdmin
      summary: Bootstrap local admin
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalBootstrapRequest'
        required: true
  /api/v1/auth/local/password:
    put:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      responses:
        '204':
          description: Password changed and all User sessions deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: changeLocalPassword
      summary: Change the authenticated User's local password
      description: Reauthenticate with the current password. Successful change deletes all User sessions, clears the cookie and requires sign-in again. OIDC credentials remain with the provider. Passwords are limited to 1024 bytes; the new password must contain at least 12 bytes.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  writeOnly: true
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  writeOnly: true
  /api/v1/auth/local/sign-in:
    post:
      security: []
      x-opencluster-access: public
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-supported
      responses:
        '200':
          $ref: '#/components/responses/SignIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: signInLocal
      summary: Sign in with local authentication
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalSignInRequest'
        required: true
  /api/v1/auth/oidc/start:
    get:
      security: []
      x-opencluster-access: public
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: startOIDCSignIn
      summary: Start OIDC sign in
      tags:
        - Authentication
  /api/v1/auth/oidc/callback:
    get:
      security: []
      x-opencluster-access: public
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: completeOIDCSignIn
      summary: Complete OIDC sign in
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
  /api/v1/session:
    get:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-cookie-csrf: not-required
      x-opencluster-idempotency: not-applicable
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: getSession
      summary: Get session
      tags:
        - Sessions
    delete:
      security:
        - SessionCookie: []
      x-opencluster-access: authenticated
      x-opencluster-cookie-csrf: required-for-unsafe-cookie-request
      x-opencluster-idempotency: not-supported
      responses:
        '200':
          $ref: '#/components/responses/SignOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: signOut
      summary: Sign out
      description: Delete the current User's session and clear its cookie. Absent or expired cookies are cleared idempotently. Origin protection remains required; storage failure returns 503 without claiming sign-out succeeded.
      tags:
        - Sessions
  /api/v1/members:
