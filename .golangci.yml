# Pinned lint gate (golangci-lint v2 — install via `make tools`).
#
version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - ineffassign
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    errcheck:
      # An explicit `_ =` is a deliberate, reviewable discard; a bare unchecked call is not.
      check-blank: false
  exclusions:
    rules:
      # Table-driven tests legitimately ignore close errors on throwaway resources.
      - path: _test\.go
        linters:
          - bodyclose
